name: Release

# Tag builds: push a tag like v1.2.0 to build the release APKs. They are
# uploaded as workflow artifacts. No GitHub release is created here.
#
# Releases: when you create (or publish) a release for a tag on GitHub, the
# APKs from that tag's build are attached to it. If the release already exists
# when the tag build finishes, the build attaches them itself.
on:
  push:
    tags: ["v*"]
  release:
    types: [created, published]

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

env:
  TAG: ${{ github.event.release.tag_name || github.ref_name }}

jobs:
  # Release events only: find the tag's build so its APKs can be reused.
  find-build:
    name: Find tag build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.find.outputs.mode }}
      run-id: ${{ steps.find.outputs.run-id }}
    steps:
      - name: Look up the tag build
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs="repos/${{ github.repository }}/actions/workflows/release.yml/runs?event=push&branch=$TAG&per_page=20"
          success=$(gh api "$runs" --jq '[.workflow_runs[] | select(.conclusion == "success")][0].id // empty')
          active=$(gh api "$runs" --jq '[.workflow_runs[] | select(.status != "completed")][0].id // empty')
          if [ -n "$success" ]; then
            echo "Using APKs from tag build run $success."
            { echo "mode=download"; echo "run-id=$success"; } >> "$GITHUB_OUTPUT"
          elif [ -n "$active" ]; then
            echo "::notice::The build for $TAG (run $active) is still running; it will attach the APKs to this release when it finishes."
            echo "mode=wait" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No successful build found for $TAG; building it now."
            echo "mode=build" >> "$GITHUB_OUTPUT"
          fi

  # Release events only: attach the APKs from the tag build.
  attach:
    name: Attach APKs to release
    needs: find-build
    if: needs.find-build.outputs.mode == 'download'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-apks-${{ env.TAG }}
          path: dist
          run-id: ${{ needs.find-build.outputs.run-id }}
          github-token: ${{ github.token }}

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --clobber --repo "${{ github.repository }}"

  build:
    name: Build release APKs
    needs: find-build
    # Runs for tag pushes, and for releases whose tag was never built.
    if: >-
      !cancelled() &&
      (github.event_name == 'push' || needs.find-build.outputs.mode == 'build')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4
        with:
          packages: >-
            platforms;android-36
            build-tools;36.0.0
            ndk;29.0.14206865
            cmake;3.31.6
          log-accepted-android-sdk-licenses: false

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Work out version from tag
        id: version
        run: |
          {
            echo "name=${TAG#v}"
            # Monotonic build number, so newer releases install over older ones.
            echo "code=${{ github.run_number }}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with the release key from repository secrets."
          else
            echo "::warning::RELEASE_KEYSTORE_BASE64 is not set. APKs are signed with a throwaway debug key and will not install over other releases."
          fi

      - name: Build release APKs and run unit tests
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: >-
          ./gradlew testDebugUnitTest assembleRelease --stacktrace
          -PsplitApks=true
          -PversionName=${{ steps.version.outputs.name }}
          -PversionCode=${{ steps.version.outputs.code }}

      - name: Collect APKs
        run: |
          mkdir dist
          for apk in app/build/outputs/apk/release/*.apk; do
            abi="$(basename "$apk" .apk)"
            abi="${abi#app-}"
            abi="${abi%-release}"
            cp "$apk" "dist/AirPlayServerTV-${{ steps.version.outputs.name }}-$abi.apk"
          done
          (cd dist && sha256sum -- *.apk > SHA256SUMS.txt)
          ls -l dist

      - name: Upload APKs as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-apks-${{ env.TAG }}
          path: dist/
          retention-days: 90
          if-no-files-found: error

      - name: Attach to release if it exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            echo "Attached APKs to release $TAG."
          else
            echo "::notice::No release for $TAG yet. The APKs are in this run's artifacts and will be attached when you create the release."
          fi
