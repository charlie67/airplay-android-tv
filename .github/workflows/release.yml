name: Release

# Push a tag like v1.2.0 (or v1.2.0-beta.1 for a pre-release) to build and
# publish the release APKs.
on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4
        with:
          packages: >-
            platforms;android-36
            build-tools;36.0.0
            ndk;29.0.14206865
            cmake;3.31.6
          log-accepted-android-sdk-licenses: false

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Work out version from tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          prerelease=false
          if [[ "$version" == *-* ]]; then prerelease=true; fi
          {
            echo "name=$version"
            # Monotonic per-release build number, so newer releases install over older ones.
            echo "code=${{ github.run_number }}"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      - name: Set up signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with the release key from repository secrets."
          else
            echo "::warning::RELEASE_KEYSTORE_BASE64 is not set. APKs are signed with a throwaway debug key and will not install over other releases."
          fi

      - name: Build release APKs and run unit tests
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: >-
          ./gradlew testDebugUnitTest assembleRelease --stacktrace
          -PsplitApks=true
          -PversionName=${{ steps.version.outputs.name }}
          -PversionCode=${{ steps.version.outputs.code }}

      - name: Collect APKs
        run: |
          mkdir dist
          for apk in app/build/outputs/apk/release/*.apk; do
            abi="$(basename "$apk" .apk)"
            abi="${abi#app-}"
            abi="${abi%-release}"
            cp "$apk" "dist/AirPlayServerTV-${{ steps.version.outputs.name }}-$abi.apk"
          done
          (cd dist && sha256sum -- *.apk > SHA256SUMS.txt)
          ls -l dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Install on Android TV with \`adb install AirPlayServerTV-${{ steps.version.outputs.name }}-universal.apk\`, or pick the APK for your TV's CPU (most TVs are armeabi-v7a)."
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            flags=()
            if [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then flags+=(--prerelease); fi
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "AirPlay Server TV ${{ steps.version.outputs.name }}" \
              --notes "$notes" --generate-notes "${flags[@]}"
          fi
